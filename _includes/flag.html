{%- comment -%} Inline country flag + name. Usage: include flag.html code="br" name="Brasil" (needs assets/images/flag-<code>.svg). Kept on one line so it works inside Markdown table cells. {%- endcomment -%}<img class="bd-brand-flag align-baseline" src="{{ '/assets/images/flag-' | append: include.code | append: '.svg' | relative_url }}" alt="" width="21" height="14"> {{ include.name }}
