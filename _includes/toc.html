{%- comment -%}
  Right-hand "Nesta página" column. assets/js/site.js fills the list from the
  post headings and reveals the column; posts with fewer than 2 headings keep it hidden.
{%- endcomment -%}
<div class="bd-toc mt-3 mb-5 my-lg-0 mb-lg-5 px-sm-1 text-body-secondary d-none" id="bdToc">
  <button class="btn btn-link link-body-emphasis text-decoration-none d-lg-none p-0 bd-toc-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#tocContents" aria-expanded="false" aria-controls="tocContents">
    Nesta página <i class="bi bi-chevron-expand ms-1"></i>
  </button>
  <strong class="d-none d-lg-block h6 my-2 ms-3">Nesta página</strong>
  <hr class="d-none d-lg-block my-2 ms-3">
  <div class="collapse bd-toc-collapse" id="tocContents">
    <nav id="TableOfContents" aria-label="Nesta página"></nav>
  </div>
</div>
