services:
  jekyll:
    build:
      context: .
      dockerfile: Dockerfile
    image: rrnazario/espanha-dicas:latest
    working_dir: /srv/jekyll
    # --force_polling: file change events don't reach the container from a Windows
    # volume, so poll instead. No --incremental: it skips pages when only layouts
    # or _data change.
    command: >-
      jekyll serve --host 0.0.0.0
                   --port 4000
                   --livereload
                   --watch
                   --force_polling
    volumes:
      - ./:/srv/jekyll
    ports:
      - "4000:4000"
      - "35729:35729"
