---
layout: default
---
<div class="container-xxl bd-gutter mt-3 my-md-4 bd-layout">
  <aside class="bd-sidebar">
    {% include sidebar.html %}
  </aside>

  <main class="bd-main order-1">
    <div class="bd-intro pt-2 ps-lg-2">
      <h1 class="bd-title mb-0">{{ page.title }}</h1>
      {% if page.description %}
        <p class="bd-lead lead mt-2">{{ page.description }}</p>
      {% endif %}
      <div class="d-flex flex-wrap gap-3 small text-body-secondary mb-3">
        {% if page.last_updated %}
          <span><i class="bi bi-calendar3 me-1"></i>Última atualização: {{ page.last_updated }}</span>
        {% endif %}
        {% include edit-link.html %}
      </div>
    </div>

    {% include toc.html %}

    <div class="bd-content ps-lg-2">
      {{ content }}
    </div>
  </main>
</div>
