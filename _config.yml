# Localization
timezone: Europe/Madrid
lang: pt-BR
locale: pt_BR

title: Espanha Dicas
url: https://rrnazario.github.io
baseurl: /espanha-dicas # post images are linked as /espanha-dicas/images/...

description: > 
  Este repositório tem como propósito reunir as dicas para brasileiros 
  vivendo na Espanha 🇪🇸

social_links:
  telegram: t.me/rrnazario
  

plugins:
  - jekyll-relative-links
  - jekyll-feed
relative_links:
  enabled: true
  collections: true

# Repository and Docker files that shouldn't be published with the site
exclude:
  - README.md
  - Dockerfile
  - docker-compose.yml
  - build.sh
  - test.sh
  - Gemfile
  - Gemfile.lock
